# ============================================================
# GitLab CI/CD Pipeline — Qualys QScanner Image Scanning
# ============================================================
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   QUALYS_ACCESS_TOKEN   — Qualys JWT access token          (Masked)
#   QUALYS_POD            — Qualys pod name, e.g. ENG-POD01
#
# Optional overrides:
#   OUTPUT_DIR            — QScanner output dir (default: /usr/local/qualys/qscanner/data/)
# ============================================================

variables:
  OUTPUT_DIR:              "/usr/local/qualys/qscanner/data/"
  PYTHON_IMAGE:            "$CI_REGISTRY_IMAGE/python-app:$CI_COMMIT_SHORT_SHA"
  PYTHON_IMAGE_LATEST:     "$CI_REGISTRY_IMAGE/python-app:latest"
  NODE_IMAGE:              "$CI_REGISTRY_IMAGE/node-app:$CI_COMMIT_SHORT_SHA"
  NODE_IMAGE_LATEST:       "$CI_REGISTRY_IMAGE/node-app:latest"

stages:
  - build
  - scan

# ── Reusable: install qscanner via official Qualys download script ─────────────
.download_qscanner: &download_qscanner
  - apk add --no-cache bash curl wget
  - wget -q "https://www.qualys.com/qscanner/download/latest/download_qscanner.sh"
  - chmod +x download_qscanner.sh
  - bash ./download_qscanner.sh
  - chmod +x ./linux-amd64/qscanner
  - ./linux-amd64/qscanner --version
  - export HOME="$CI_PROJECT_DIR"
  - mkdir -p "$OUTPUT_DIR"
  - rm -rf "${OUTPUT_DIR:?}"/*


# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — BUILD
# ═══════════════════════════════════════════════════════════════════════════════

build-python-app:
  image: docker:24.0.2
  stage: build
  tags:
    - qualys-internal
  services:
    - docker:24.0.2-dind
  script:
    - docker build --tag "$PYTHON_IMAGE" --tag "$PYTHON_IMAGE_LATEST"
        --file apps/python-app/Dockerfile apps/python-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$PYTHON_IMAGE"
    - docker push "$PYTHON_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$PYTHON_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > python_image_id.txt
  artifacts:
    paths:
      - python_image_id.txt

build-node-app:
  image: docker:24.0.2
  stage: build
  tags:
    - qualys-internal
  services:
    - docker:24.0.2-dind
  script:
    - docker build --tag "$NODE_IMAGE" --tag "$NODE_IMAGE_LATEST"
        --file apps/node-app/Dockerfile apps/node-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$NODE_IMAGE"
    - docker push "$NODE_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$NODE_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > node_image_id.txt
  artifacts:
    paths:
      - node_image_id.txt

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — QUALYS IMAGE SCAN
# ═══════════════════════════════════════════════════════════════════════════════

scan-python-app:
  image: docker:24.0.2
  stage: scan
  tags:
    - qualys-internal
  services:
    - docker:24.0.2-dind
  needs:
    - job: build-python-app
      artifacts: true
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$PYTHON_IMAGE"
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "Scanning image: $PYTHON_IMAGE"
      ./linux-amd64/qscanner image "$PYTHON_IMAGE" \
        --pod "$QUALYS_POD" \
        -l debug \
        --scan-types pkg \
        --skip-verify-tls \
        --report-format gitlab \
        --collect-build-pipeline-metadata=true \
        -o "$OUTPUT_DIR" || QSCANNER_RC=$?
      echo "qscanner exit code: ${QSCANNER_RC:-0}"
      echo "--- OUTPUT_DIR contents ---"
      ls -ltr "$OUTPUT_DIR/" || echo "OUTPUT_DIR is empty or missing"
      VULN_SRC=$(find "$OUTPUT_DIR" -name "*-gitlab_vuln_report.json" 2>/dev/null | head -1)
      [ -z "$VULN_SRC" ] && echo "ERROR: vuln report not found in $OUTPUT_DIR" && exit 1
      cp "$VULN_SRC" "python_gitlab_vuln_report.json"
      exit ${QSCANNER_RC:-0}
  artifacts:
    access: developer
    when: always
    paths:
      - python_gitlab_vuln_report.json
    reports:
      container_scanning: python_gitlab_vuln_report.json

scan-node-app:
  image: docker:24.0.2
  stage: scan
  tags:
    - qualys-internal
  services:
    - docker:24.0.2-dind
  needs:
    - job: build-node-app
      artifacts: true
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$NODE_IMAGE"
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "Scanning image: $NODE_IMAGE"
      ./linux-amd64/qscanner image "$NODE_IMAGE" \
        --pod "$QUALYS_POD" \
        -l debug \
        --scan-types pkg \
        --skip-verify-tls \
        --report-format gitlab \
        --collect-build-pipeline-metadata=true \
        -o "$OUTPUT_DIR" || QSCANNER_RC=$?
      echo "qscanner exit code: ${QSCANNER_RC:-0}"
      echo "--- OUTPUT_DIR contents ---"
      ls -ltr "$OUTPUT_DIR/" || echo "OUTPUT_DIR is empty or missing"
      VULN_SRC=$(find "$OUTPUT_DIR" -name "*-gitlab_vuln_report.json" 2>/dev/null | head -1)
      [ -z "$VULN_SRC" ] && echo "ERROR: vuln report not found in $OUTPUT_DIR" && exit 1
      cp "$VULN_SRC" "node_gitlab_vuln_report.json"
      exit ${QSCANNER_RC:-0}
  artifacts:
    access: developer
    when: always
    paths:
      - node_gitlab_vuln_report.json
    reports:
      container_scanning: node_gitlab_vuln_report.json

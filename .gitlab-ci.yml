# ============================================================
# GitLab CI/CD Pipeline — Qualys QScanner Image Scanning
# ============================================================
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   QUALYS_ACCESS_TOKEN   — Qualys JWT access token          (Masked)
#   QUALYS_POD            — Qualys pod name, e.g. ENG-POD01
#
# Optional overrides:
#   OUTPUT_DIR            — QScanner output dir (default: /usr/local/qualys/qscanner/data/)
# ============================================================

variables:
  OUTPUT_DIR:              "/usr/local/qualys/qscanner/data/"
  PYTHON_IMAGE:            "$CI_REGISTRY_IMAGE/python-app:$CI_COMMIT_SHORT_SHA"
  PYTHON_IMAGE_LATEST:     "$CI_REGISTRY_IMAGE/python-app:latest"
  NODE_IMAGE:              "$CI_REGISTRY_IMAGE/node-app:$CI_COMMIT_SHORT_SHA"
  NODE_IMAGE_LATEST:       "$CI_REGISTRY_IMAGE/node-app:latest"
  RAILS_IMAGE:             "$CI_REGISTRY_IMAGE/rails-app:$CI_COMMIT_SHORT_SHA"
  RAILS_IMAGE_LATEST:      "$CI_REGISTRY_IMAGE/rails-app:latest"
  DOCKER_HOST:             "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR:      ""
  QSCANNER_VERSION:        "5.1.0"
  QSCANNER_PKG_URL:        "https://gitlab.com/api/v4/projects/82155352/packages/generic/qscanner/${QSCANNER_VERSION}/qscanner"

stages:
  - build
  - scan
#test change
# ── Reusable: download qscanner 5.x from GitLab Package Registry ─────────────
.download_qscanner: &download_qscanner
  - apk add --no-cache curl
  - mkdir -p linux-amd64
  - |
    echo "Downloading qscanner ${QSCANNER_VERSION} from GitLab Package Registry..."
    curl --silent --fail --location \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --output linux-amd64/qscanner \
      "${QSCANNER_PKG_URL}"
  - chmod +x ./linux-amd64/qscanner
  - ./linux-amd64/qscanner --version
  - export HOME="$CI_PROJECT_DIR"
  - mkdir -p "$OUTPUT_DIR"
  - rm -rf "${OUTPUT_DIR:?}"/*


# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — BUILD
# ═══════════════════════════════════════════════════════════════════════════════

build-python-app:
  image: docker:27
  stage: build
  tags:
    - qualys-internal
  script:
    - docker build --tag "$PYTHON_IMAGE" --tag "$PYTHON_IMAGE_LATEST"
        --file apps/python-app/Dockerfile apps/python-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$PYTHON_IMAGE"
    - docker push "$PYTHON_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$PYTHON_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > python_image_id.txt
  artifacts:
    paths:
      - python_image_id.txt

build-node-app:
  image: docker:27
  stage: build
  tags:
    - qualys-internal
  script:
    - docker build --tag "$NODE_IMAGE" --tag "$NODE_IMAGE_LATEST"
        --file apps/node-app/Dockerfile apps/node-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$NODE_IMAGE"
    - docker push "$NODE_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$NODE_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > node_image_id.txt
  artifacts:
    paths:
      - node_image_id.txt

build-rails-app:
  image: docker:27
  stage: build
  tags:
    - qualys-internal
  script:
    - docker build --tag "$RAILS_IMAGE" --tag "$RAILS_IMAGE_LATEST"
        --file apps/rails-app/Dockerfile apps/rails-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$RAILS_IMAGE"
    - docker push "$RAILS_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$RAILS_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > rails_image_id.txt
  artifacts:
    paths:
      - rails_image_id.txt

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — QUALYS IMAGE SCAN
# ═══════════════════════════════════════════════════════════════════════════════

scan-python-app:
  image: docker:27
  stage: scan
  tags:
    - qualys-internal
  needs:
    - job: build-python-app
      artifacts: true
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$PYTHON_IMAGE"
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "QUALYS_POD value: [${QUALYS_POD}]"
      echo "QUALYS_ACCESS_TOKEN set: $([ -n "$QUALYS_ACCESS_TOKEN" ] && echo YES || echo NO)"
      echo "Scanning image: $PYTHON_IMAGE"
      ./linux-amd64/qscanner image "$PYTHON_IMAGE" \
        --pod "$QUALYS_POD" \
        -l debug \
        --scan-types pkg \
        --skip-verify-tls \
        --collect-build-pipeline-metadata=true \
        -o "$OUTPUT_DIR" || QSCANNER_RC=$?
      echo "qscanner exit code: ${QSCANNER_RC:-0}"
      exit 0

scan-rails-app:
  image: docker:27
  stage: scan
  tags:
    - qualys-internal
  needs:
    - job: build-rails-app
      artifacts: true
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$RAILS_IMAGE"
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "QUALYS_POD value: [${QUALYS_POD}]"
      echo "QUALYS_ACCESS_TOKEN set: $([ -n "$QUALYS_ACCESS_TOKEN" ] && echo YES || echo NO)"
      echo "Scanning image: $RAILS_IMAGE"
      ./linux-amd64/qscanner image "$RAILS_IMAGE" \
        --pod "$QUALYS_POD" \
        -l debug \
        --scan-types pkg \
        --skip-verify-tls \
        --collect-build-pipeline-metadata=true \
        -o "$OUTPUT_DIR" || QSCANNER_RC=$?
      echo "qscanner exit code: ${QSCANNER_RC:-0}"
      exit 0

scan-node-app:
  image: docker:27
  stage: scan
  tags:
    - qualys-internal
  needs:
    - job: build-node-app
      artifacts: true
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$NODE_IMAGE"
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "QUALYS_POD value: [${QUALYS_POD}]"
      echo "QUALYS_ACCESS_TOKEN set: $([ -n "$QUALYS_ACCESS_TOKEN" ] && echo YES || echo NO)"
      echo "Scanning image: $NODE_IMAGE"
      ./linux-amd64/qscanner image "$NODE_IMAGE" \

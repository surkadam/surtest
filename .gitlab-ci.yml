stages:
  - build
  - scan

variables:
  QUALYS_POD:         "ENG-POD01"
  GHCR_ORG:           "surkadam"
  DOCKER_DRIVER:      overlay2
  DOCKER_TLS_CERTDIR: ""
  # Set QSCANNER_BINARY_URL in GitLab CI/CD Variables (Settings → CI/CD → Variables)
  # Get the URL from: https://jenkins.intranet.qualys.com/job/CS-Sensor/job/QScanner/job/develop/
  # → Latest build → right-click qscanner artifact → Copy link address
  # QSCANNER_BINARY_URL: "https://jenkins.intranet.qualys.com/job/CS-Sensor/job/QScanner/job/develop/lastSuccessfulBuild/artifact/qscanner"

# ── Reusable: derive image tag from branch name ────────────────────────────────
.set_image_vars: &set_image_vars
  - BRANCH_TAG=$(echo "${CI_COMMIT_BRANCH:-unknown}" | sed 's/\//-/g')
  - PYTHON_IMAGE="ghcr.io/${GHCR_ORG}/qscanner-demo/python-app:${BRANCH_TAG}"
  - NODE_IMAGE="ghcr.io/${GHCR_ORG}/qscanner-demo/node-app:${BRANCH_TAG}"
  - echo "Branch  ${BRANCH_TAG}  Commit  ${CI_COMMIT_SHA}"

# ── Reusable: download qscanner 5.1.0 from GitLab Package Registry ────────────
.get_qscanner: &get_qscanner
  - echo "[qscanner] Downloading binary from GitLab Package Registry..."
  - |
    curl -fsSL \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/generic/qscanner/5.1.0/qscanner" \
      -o qscanner
  - chmod +x qscanner
  - ./qscanner --version

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — BUILD
# ═══════════════════════════════════════════════════════════════════════════════

build_python_app:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - *set_image_vars
    - docker build -t "${PYTHON_IMAGE}" ./apps/python-app
    - echo "PYTHON_IMAGE=${PYTHON_IMAGE}" > python.env
  artifacts:
    reports:
      dotenv: python.env

build_node_app:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - *set_image_vars
    - docker build -t "${NODE_IMAGE}" ./apps/node-app
    - echo "NODE_IMAGE=${NODE_IMAGE}" > node.env
  artifacts:
    reports:
      dotenv: node.env

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — QUALYS IMAGE SCAN
# ═══════════════════════════════════════════════════════════════════════════════

scan_python_image:
  stage: scan
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: build_python_app
      artifacts: true
  script:
    - *set_image_vars
    - *get_qscanner
    - |
      ./qscanner image "${PYTHON_IMAGE}" \
        --pod "${QUALYS_POD}" \
        --skip-verify-tls \
        -l debug \
        --client-id "${QUALYS_CLIENT_ID}" \
        --client-secret "${QUALYS_CLIENT_SECRET}" \
        --collect-build-pipeline-metadata=true
  after_script:
    - BRANCH_TAG=$(echo "${CI_COMMIT_BRANCH:-unknown}" | sed 's/\//-/g')
    - echo "Query → buildPipelineMetadata.repositoryMetadata.repository:\"https://gitlab.com/surkadam/qscanner-demo.git\" AND buildPipelineMetadata.repositoryMetadata.branch:\"${BRANCH_TAG}\" AND buildPipelineMetadata.repositoryMetadata.commits.hash:\"${CI_COMMIT_SHA}\""

scan_node_image:
  stage: scan
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: build_node_app
      artifacts: true
  script:
    - *set_image_vars
    - *get_qscanner
    - |
      ./qscanner image "${NODE_IMAGE}" \
        --pod "${QUALYS_POD}" \
        --skip-verify-tls \
        -l debug \
        --client-id "${QUALYS_CLIENT_ID}" \
        --client-secret "${QUALYS_CLIENT_SECRET}" \
        --collect-build-pipeline-metadata=true

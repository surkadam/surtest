# ============================================================
# GitLab CI/CD Pipeline — Qualys QScanner: Code → Build → Image Scan
# ============================================================
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   QUALYS_ACCESS_TOKEN   — Qualys JWT access token          (Masked)
#   QUALYS_POD            — Qualys pod name, e.g. ENG-POD01
#   QUALYS_CLIENT_ID      — Qualys OAuth client ID           (Masked)
#   QUALYS_CLIENT_SECRET  — Qualys OAuth client secret       (Masked)
#   QUALYS_REGISTRY_TOKEN — GitLab PAT for repo access       (Masked)
#   JENKINS_USER          — Jenkins user for artifact download (Masked)
#   JENKINS_TOKEN         — Jenkins API token                (Masked)
#
# Pipeline flow:
#   1. code-scan  — runs automatically on every commit (qscanner code)
#   2. build      — triggered manually when image build is needed
#   3. image-scan — manual trigger, decoupled from build (scans image from registry or local daemon)
# ============================================================
variables:
  OUTPUT_DIR:              "/usr/local/qualys/qscanner/data/"
  PYTHON_IMAGE:            "$CI_REGISTRY_IMAGE/python-app:$CI_COMMIT_SHORT_SHA"
  PYTHON_IMAGE_LATEST:     "$CI_REGISTRY_IMAGE/python-app:latest"
  NODE_IMAGE:              "$CI_REGISTRY_IMAGE/node-app:$CI_COMMIT_SHORT_SHA"
  NODE_IMAGE_LATEST:       "$CI_REGISTRY_IMAGE/node-app:latest"
  RAILS_IMAGE:             "$CI_REGISTRY_IMAGE/rails-app:$CI_COMMIT_SHORT_SHA"
  RAILS_IMAGE_LATEST:      "$CI_REGISTRY_IMAGE/rails-app:latest"
  DOCKER_HOST:             "tcp://docker:2375"
  DOCKER_TLS_CERTDIR:      ""
  DOCKER_DRIVER:           "overlay2"
  QSCANNER_VERSION:        "5.3.0-639-dev"
  QSCANNER_BINARY_URL:     "https://jenkins.intranet.qualys.com/job/CS-Sensor/job/QScanner/job/develop/639/artifact/output/qscanner-${QSCANNER_VERSION}.linux-amd64.tar.gz"
  CODE_REPO_URL:           "https://gitlab.com/surkadam/qscanner-demo.git"

stages:
  - code-scan
  - build
  - image-scan

# ── Reusable: download qscanner 5.x tarball from Jenkins and extract ─────────
.download_qscanner: &download_qscanner
  - apk add --no-cache curl tar
  - mkdir -p linux-amd64
  - |
    SCAN_URL="${QUALYS_BINARY_URL:-${QSCANNER_BINARY_URL}}"
    echo "Downloading qscanner ${QSCANNER_VERSION} from Jenkins..."
    echo "URL: ${SCAN_URL}"
    HTTP_CODE=$(curl --silent --show-error --location --insecure \
      --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
      --output qscanner.tar.gz \
      --write-out "%{http_code}" \
      "${SCAN_URL}") || CURL_RC=$?
    echo "HTTP status: ${HTTP_CODE:-N/A}  curl exit: ${CURL_RC:-0}"
    if [ "${HTTP_CODE:-}" != "200" ]; then
      echo "!! Download failed (401/403 = bad JENKINS_USER/JENKINS_TOKEN, 404 = wrong artifact URL)"
      exit 1
    fi
    tar xzf qscanner.tar.gz
    BIN=$(find . -type f -name qscanner | head -1)
    mv "$BIN" ./linux-amd64/qscanner
    chmod +x ./linux-amd64/qscanner
    ./linux-amd64/qscanner --version
    export HOME="$CI_PROJECT_DIR"
    mkdir -p "$OUTPUT_DIR"
    rm -rf "${OUTPUT_DIR:?}"/*


# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — CODE SCAN (auto-runs on every single commit)
# ═══════════════════════════════════════════════════════════════════════════════

scan-code:
  image: docker:27
  stage: code-scan
  tags:
    - qualys-internal
  script:
    - *download_qscanner
    - |
      echo "QUALYS_POD: [${QUALYS_POD}]"
      echo "QUALYS_CLIENT_ID set: $([ -n "$QUALYS_CLIENT_ID" ] && echo YES || echo NO)"
      echo "QUALYS_CLIENT_SECRET set: $([ -n "$QUALYS_CLIENT_SECRET" ] && echo YES || echo NO)"
      echo "Cloning branch ${CI_COMMIT_REF_NAME} (shallow) for code scan..."
      apk add --no-cache git
      git clone --branch "$CI_COMMIT_REF_NAME" --single-branch --depth 1 \
        "https://oauth2:${QUALYS_REGISTRY_TOKEN}@gitlab.com/surkadam/qscanner-demo.git" \
        ./scan-target
      echo "Scanning branch: ${CI_COMMIT_REF_NAME}"
      ./linux-amd64/qscanner code "./scan-target" \
        --pod "$QUALYS_POD" \
        --skip-verify-tls \
        -l debug \
        --collect-build-pipeline-metadata=true \
        --scan-types pkg,compliance \
        --compliance-benchmarks AI_NIST_RMF,AI_EU_ACT,AI_PCI_DSS \
        --client-id "$QUALYS_CLIENT_ID" \
        --client-secret "$QUALYS_CLIENT_SECRET" || SCAN_RC=$?
      echo "qscanner code scan exit code: ${SCAN_RC:-0}"
      if [ "${SCAN_RC:-0}" -eq 40 ]; then
        echo "Exit 40: scan submitted, report not yet available (non-fatal)"
        exit 0
      fi
      exit ${SCAN_RC:-0}

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — BUILD (manual trigger — run only when image scan is needed)
# ═══════════════════════════════════════════════════════════════════════════════

build-python-app:
  image: docker:27
  stage: build
  when: manual
  services:
    - docker:dind
  tags:
    - qualys-internal
  script:
    - docker build --tag "$PYTHON_IMAGE" --tag "$PYTHON_IMAGE_LATEST"
        --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA"
        --file apps/python-app/Dockerfile apps/python-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$PYTHON_IMAGE"
    - docker push "$PYTHON_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$PYTHON_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > python_image_id.txt
  artifacts:
    paths:
      - python_image_id.txt

build-node-app:
  image: docker:27
  stage: build
  when: manual
  services:
    - docker:dind
  tags:
    - qualys-internal
  script:
    - docker build --tag "$NODE_IMAGE" --tag "$NODE_IMAGE_LATEST"
        --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA"
        --file apps/node-app/Dockerfile apps/node-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$NODE_IMAGE"
    - docker push "$NODE_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$NODE_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > node_image_id.txt
  artifacts:
    paths:
      - node_image_id.txt

build-rails-app:
  image: docker:27
  stage: build
  when: manual
  services:
    - docker:dind
  tags:
    - qualys-internal
  script:
    - docker build --tag "$RAILS_IMAGE" --tag "$RAILS_IMAGE_LATEST"
        --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA"
        --file apps/rails-app/Dockerfile apps/rails-app
    - docker login --username gitlab-ci-token --password "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$RAILS_IMAGE"
    - docker push "$RAILS_IMAGE_LATEST"
    - |
      IMAGE_ID=$(docker inspect --format='{{.Id}}' "$RAILS_IMAGE" | sed 's/^sha256://')
      echo "IMAGE_ID: $IMAGE_ID"
      echo "$IMAGE_ID" > rails_image_id.txt
  artifacts:
    paths:
      - rails_image_id.txt

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — IMAGE SCAN (auto-runs after build)
# ═══════════════════════════════════════════════════════════════════════════════

scan-python-app:
  image: docker:27
  stage: image-scan
  when: manual
  needs: []          # decoupled — trigger regardless of build stage
  services:
    - docker:dind
  tags:
    - qualys-internal
  script:
    - *download_qscanner
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - |
      if docker pull "$PYTHON_IMAGE"; then
        SCAN_IMAGE="$PYTHON_IMAGE"
      else
        echo "[info] $PYTHON_IMAGE not found (no build ran for this commit) — using :latest"
        docker pull "$PYTHON_IMAGE_LATEST"
        SCAN_IMAGE="$PYTHON_IMAGE_LATEST"
      fi
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "QUALYS_POD value: [${QUALYS_POD}]"
      echo "QUALYS_ACCESS_TOKEN set: $([ -n "$QUALYS_ACCESS_TOKEN" ] && echo YES || echo NO)"
      echo "Scanning image: $SCAN_IMAGE"
      ./linux-amd64/qscanner image "$SCAN_IMAGE" \
        --pod "$QUALYS_POD" \
        -l debug \
        --scan-types pkg \
        --skip-verify-tls \
        --collect-build-pipeline-metadata=true \
        -o "$OUTPUT_DIR" || QSCANNER_RC=$?
      echo "qscanner exit code: ${QSCANNER_RC:-0}"
      exit 0


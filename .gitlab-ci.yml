      if docker pull "$NODE_IMAGE"; then
        SCAN_IMAGE="$NODE_IMAGE"
      else
        echo "[info] $NODE_IMAGE not found (no build ran for this commit) — using :latest"
        docker pull "$NODE_IMAGE_LATEST"
        SCAN_IMAGE="$NODE_IMAGE_LATEST"
      fi
    - export QUALYS_ACCESS_TOKEN="$QUALYS_ACCESS_TOKEN"
    - |
      echo "QUALYS_POD value: [${QUALYS_POD}]"
